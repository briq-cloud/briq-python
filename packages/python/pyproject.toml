[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "briq-cloud"
dynamic = ["version"]
description = "The Python client for briq: run sandboxes for your agents, run commands and move files."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["briq", "sandbox", "agents", "microvm", "api-client"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://briq.cloud"
Repository = "https://github.com/briq-cloud/briq-python"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.version]
path = "src/briq_cloud/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/briq_cloud"]

[tool.hatch.build.targets.sdist]
# What a consumer needs: the tests, their snapshot of the API and the dev scripts stay in the repo.
include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PT"]
ignore = ["PT018", "PT012"]  # a test may assert two facts at once

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]
